<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 75" width="380" height="75">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4f9c" />
      <stop offset="100%" stop-color="#073467" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(4, 2)">
    <!-- Speed Wings Behind -->
    <path d="M42,12 Q65,8 72,26 Q56,22 36,26 Z" fill="url(#orangeGrad)" opacity="0.9" />
    <path d="M38,22 Q68,18 74,40 Q54,34 33,37 Z" fill="url(#orangeGrad)" />
    
    <!-- Curved Speed Arrow Top -->
    <path d="M10,38 C10,20 26,8 45,6 L42,1 L55,9 L44,18 L44,11 C30,13 18,23 18,38 Z" fill="url(#orangeGrad)" />
    
    <!-- 3D Box Main -->
    <!-- Top Face -->
    <polygon points="30,20 48,13 65,20 47,28" fill="#2563eb" />
    <polygon points="38,17 48,13 56,17 47,21" fill="#60a5fa" />
    
    <!-- Left Face -->
    <polygon points="30,20 47,28 47,54 30,44" fill="url(#boxGrad)" />
    
    <!-- Right Face -->
    <polygon points="47,28 65,20 65,44 47,54" fill="#093d77" />
    
    <!-- Tape / Package details -->
    <polygon points="37,23 40,25 40,50 37,48" fill="#93c5fd" opacity="0.8" />
    
    <!-- Bottom Swoosh Arrow -->
    <path d="M18,42 C22,58 43,65 60,54 L58,60 L71,51 L61,43 L60,48 C46,56 28,51 25,42 Z" fill="url(#orangeGrad)" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Title -->
  <text x="88" y="42" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#072a53" letter-spacing="-0.5">
    ZIVA <tspan fill="#ff6a00">COURIER</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="90" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#0284c7" letter-spacing="2">
    INTERNATIONAL COURIER SERVICE
  </text>
</svg>
